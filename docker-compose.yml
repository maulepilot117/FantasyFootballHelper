services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ffh
      POSTGRES_PASSWORD: ffh
      POSTGRES_DB: ffh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ffh -d ffh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.10-bookworm
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
