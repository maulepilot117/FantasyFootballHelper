apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ffh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maulepilot117/FantasyFootballHelper
    targetRevision: main
    path: deploy/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: ffh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
